name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host tests + data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Firmware tables vs analysis data
        run: python tools/check_tables.py
      - name: WebUI bundle is up to date
        run: python tools/build_webui.py --check
      - name: WebUI JavaScript syntax
        run: |
          node --check webui/app.js
          node --check webui/scanner.js
      - name: Host tests (g++)
        env:
          CXX: g++
        run: python tools/run_host_tests.py
      - name: Test the embedded WebUI in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/hfm-ui" --no-save --package-lock=false playwright@1.62.1
          NODE_PATH="$RUNNER_TEMP/hfm-ui/node_modules" HFM_CHROME="$(command -v google-chrome)" node tools/check_scanner_ui.cjs

  firmware:
    name: Compile ESP32-S3 (Arduino core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install U8g2@2.35.30
      - name: Compile HFMConnect.ino (with OLED, Huge APP)
        run: |
          set -o pipefail
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PartitionScheme=huge_app,CDCOnBoot=default \
            --warnings default --build-path build/fw firmware/HFMConnect 2>&1 | tee build/compile.log
      - name: Verify and export the full 4 MiB image
        run: |
          test "$(stat -c %s build/fw/HFMConnect.ino.merged.bin)" -eq 4194304
          cp build/fw/HFMConnect.ino.merged.bin build/HFM-Connect-ESP32S3-full.bin
      - name: Upload firmware binary
        uses: actions/upload-artifact@v6
        with:
          name: HFMConnect-esp32s3
          path: build/HFM-Connect-ESP32S3-full.bin
          if-no-files-found: error
